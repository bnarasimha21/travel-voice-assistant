name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-dev.txt

      - name: Cache Kokoro and Smart Turn model files
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0-int8-smart-turn-v3.2

      - name: Cache Hugging Face models (Whisper tiny, faster-whisper tiny, Silero VAD)
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: hf-whisper-tiny-faster-whisper-tiny-silero-v2

      - name: Download models if not cached
        run: |
          mkdir -p models
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -f models/kokoro-v1.0.int8.onnx ] || curl -fsSL -o models/kokoro-v1.0.int8.onnx "$base/kokoro-v1.0.int8.onnx"
          [ -f models/voices-v1.0.bin ] || curl -fsSL -o models/voices-v1.0.bin "$base/voices-v1.0.bin"
          [ -f models/smart-turn-v3.2-cpu.onnx ] || curl -fsSL -o models/smart-turn-v3.2-cpu.onnx \
            https://huggingface.co/pipecat-ai/smart-turn-v3/resolve/main/smart-turn-v3.2-cpu.onnx
          python -c "from huggingface_hub import snapshot_download; snapshot_download('openai/whisper-tiny')"
          python -c "from huggingface_hub import snapshot_download; snapshot_download('Systran/faster-whisper-tiny')"
          python -c "from voice_agent.vad import warm_up_silero; warm_up_silero()"

      - name: Unit and integration tests
        run: pytest -q

      - name: Voice eval matrix (stub LLM; Whisper tiny and faster-whisper tiny, silence and Smart Turn)
        # Hosted runners are slower than the reference laptop the budgets were set on.
        # Deepgram Flux and the speech-to-speech rows are skipped: CI has no keys for them.
        run: python -m evals.run --llm stub --matrix --budget-scale 2.5

      - name: Keep eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
          if-no-files-found: ignore
