[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    realmodels: needs real local models (Whisper, Kokoro, Smart Turn) on disk; skipped when they are missing
    live: calls a hosted service; skipped unless its key and RUN_LIVE_LLM=1 are set
filterwarnings =
    ignore::DeprecationWarning
